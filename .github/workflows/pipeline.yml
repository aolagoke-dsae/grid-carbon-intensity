name: pipeline

# Unit tests, and the dbt project parsed and built on fixtures, on every push,
# plus a weekly run.
#
# The matrix tests the ends, not the middle: 3.11 is the oldest version this
# project claims to support, 3.14 is the version it is developed on. A failure
# that exists only between them is rare enough not to buy a third job.
#
# requirements.txt pins nothing, so each run installs the newest of everything.
# That makes the Monday run a drift detector, and it means a red build has two
# different meanings:
#   red after a push you made   -> you broke something
#   red on a Monday, no commits -> the ecosystem moved, not you
# Read the trigger before reading the failure.
#
# Deliberately NOT in CI: src/ingest/smoke.py and smoke_smard.py. Those call
# live APIs and smoke.py needs the ENTSO-E token. A build must not depend on a
# third party being up, and a secret must not be needed to verify the code.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"    # Mondays 06:17 UTC

jobs:
  tests:
    name: unit tests
    # Pinned, not ubuntu-latest: the latest label migrates to Ubuntu 26 on
    # 19.10.2026. Until the capstone ships on 11.12.2026 a red build should mean
    # this code broke, not that the runner image changed. Revisit in January.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # The dbt build on fixtures runs once, in the dbt job below, not on
      # every Python version.
      - name: pytest
        run: python -m pytest -q --ignore=src/transform/test_dbt_models.py

  dbt:
    name: dbt parses, builds on fixtures and matches the parser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Provide a profile and a warehouse directory
        run: |
          cp dbt/profiles.example.yml dbt/profiles.yml
          mkdir -p warehouse

      # Resolves every model, source, ref and test without touching data.
      # Catches a broken ref, a renamed source and a Jinja error at push time.
      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir .

      # The synthetic sample in curated/sample/, built from the clean checkout
      # as a reader's clone has it: no token, no landing, no fixtures. It
      # shows that the code runs; the real figures need the ENTSO-E pulls.
      - name: dbt build on the committed sample, as a clone without a token
        env:
          GRID_ROOT: "."
        run: dbt build --project-dir dbt --profiles-dir dbt --target sample

      # Lands fixture payloads, builds every enabled model with dbt-duckdb and
      # compares the SQL with the Python parser step by step, then deletes a
      # day and checks that the coverage test fails. Until 17.10.2026 CI only
      # parsed, so no model had ever run here. REQUIRE_DBT turns the test's
      # skip-if-no-dbt into a failure: this step cannot pass by not running.
      - name: dbt build on fixtures, checked against parse()
        env:
          REQUIRE_DBT: "1"
        run: python -m pytest -q src/transform/test_dbt_models.py
