name: pipeline

# Unit tests and a dbt parse on every push, plus a weekly run so that
# dependency drift surfaces here rather than in December.
#
# Deliberately NOT in CI: src/ingest/smoke.py and smoke_smard.py. Those call
# live APIs and smoke.py needs the ENTSO-E token. A build must not depend on a
# third party being up, and a secret must not be needed to verify the code.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"    # Mondays 06:17 UTC

jobs:
  tests:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  dbt:
    name: dbt project parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Provide a profile and a warehouse directory
        run: |
          cp dbt/profiles.example.yml dbt/profiles.yml
          mkdir -p warehouse

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      # Resolves every model, source, ref and test without touching data.
      # Catches a broken ref, a renamed source and a Jinja error at push time.
      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir .
