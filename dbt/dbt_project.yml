name: grid_intensity
version: "1.0.0"
config-version: 2
profile: grid_intensity

model-paths: ["models"]
test-paths:  ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# No seed-paths: the factor table lives once, in ../config/ipcc_ar5_factors.csv,
# and is read directly by DuckDB. One copy, no drift. The same holds for
# zones.csv, sparse_series.csv and source_gaps.csv.
#
# Every path the models read hangs off the environment variable GRID_ROOT,
# the repository root. Its default, '..', is that root seen from dbt/, so
# `dbt build` works from dbt/ as before; from the root, set GRID_ROOT=. and
# pass --project-dir dbt --profiles-dir dbt (audit B5).

# TRAP 5. A DE-LU A44 payload carries two complete, disagreeing day-ahead
# price curves separated only by classificationSequence. This picks one.
# Override per run:  dbt build --vars '{a44_curve: 2}'
#   1  the day-ahead market's: hourly MTU, then 15-minute from 2025-10-01.
#      Default.
#   2  15-minute across the whole year, including the nine months before
#      15-minute MTU went live.
# Curve 1 equals SMARD filter 4169 to the cent at every hour and quarter-hour
# of 2021-2025 (19.10.2026, notebooks/price_curves.py). See the header of
# models/staging/stg_entsoe__prices.sql.
vars:
  a44_curve: 1
  # The Monte Carlo draws every step shares (models/marts/dim_factor_draw.py).
  # The count is fixed by the rule in RUNBOOK Stage 6, the seed is
  # src/transform/intensity.py's MC_SEED. Override per run, for Checkpoint 8's
  # convergence check:  dbt build --vars '{mc_draws: 20000}'
  mc_draws: 10000
  mc_seed: 20260917

models:
  grid_intensity:
    staging:      {+materialized: view,  +schema: staging}
    intermediate: {+materialized: view,  +schema: intermediate}
    marts:        {+materialized: table, +schema: marts}
