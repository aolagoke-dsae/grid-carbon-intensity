version: 2

models:
  - name: int_generation_gapfilled
    description: Every step of every period; A03 carried forward, A01 not.
    columns:
      - name: mw
        description: NULL where an A01 position is missing or an A03 series has no position 1. Both are data errors.
        data_tests:
          - not_null
  - name: int_generation_net
    description: Generation and consumption legs side by side; a full outer join, so a pump-only step keeps its consumption.
  - name: int_generation_energy
    description: MW times step_hours, per direction.
  - name: int_generation_partial_steps
    description: >
      The generation steps at which a series the zone publishes is missing
      and config/sparse_series.csv does not exempt it, with the missing series
      named: the SQL twin of validate.incomplete_steps. fact_intensity
      withholds the intensity of these steps.
  - name: int_prices_gapfilled
    description: >
      Every step of every price period of the curve stg_entsoe__prices keeps;
      an A03 price that repeats is carried forward, an A01 price never is.
  - name: int_intensity_interval
    description: >
      The 5th, 50th and 95th percentiles of every generation step's intensity
      under the factor draws of dim_factor_draw, computed by
      intensity.step_intervals from the step's priced energy by fuel. A step
      without priced energy has no row; fact_intensity withholds the rest
      where it withholds the point.
