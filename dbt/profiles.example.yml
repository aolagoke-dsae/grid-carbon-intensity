# Copy to dbt/profiles.yml (git-ignored) and pass --profiles-dir, or to ~/.dbt/.
grid_intensity:
  target: dev
  outputs:
    dev:
      type: duckdb
      # GRID_ROOT is the repository root; its default, '..', is that root seen
      # from dbt/. No extensions line: parquet is built into DuckDB, and
      # listing it made dbt try to download it (audit B7).
      path: "{{ env_var('GRID_ROOT', '..') }}/warehouse/grid.duckdb"
      threads: 4
    # A clone without an ENTSO-E token: --target sample builds the synthetic
    # sample in curated/sample/ into its own file, so the real warehouse is
    # never touched (src/transform/sample_data.py).
    sample:
      type: duckdb
      path: "{{ env_var('GRID_ROOT', '..') }}/warehouse/sample.duckdb"
      threads: 4
